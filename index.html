            <form id="auth-form" class="space-y-4" onsubmit="event.preventDefault();">
                <div id="name-field" class="hidden">
                    <label class="block text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-1">Nombre Completo</label>
                    <input type="text" id="auth-name" autocomplete="name" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-white rounded-xl focus:border-emerald-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-1">Correo Electrónico</label>
                    <input type="email" id="auth-email" name="email" autocomplete="username" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-white rounded-xl focus:border-emerald-500 outline-none text-sm">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-[10px] font-bold uppercase text-slate-400 tracking-wider">Contraseña</label>
                        <button type="button" id="forgot-password-link" onclick="handleForgotPassword()" class="text-[11px] text-emerald-400 hover:underline">¿Olvidaste tu contraseña?</button>
                    </div>
                    <input type="password" id="auth-password" name="password" autocomplete="current-password" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-white rounded-xl focus:border-emerald-500 outline-none text-sm">
                </div>
                <button type="button" id="auth-btn" onclick="handleAuthSubmit()" class="w-full bg-emerald-500 text-white py-3.5 rounded-xl font-bold hover:bg-emerald-600 transition shadow-lg shadow-emerald-500/20 text-sm active:opacity-80 cursor-pointer">Iniciar Sesión</button>
            </form>
