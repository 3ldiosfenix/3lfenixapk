<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Mis Finanzas - 3ldiosfenix</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135706.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col justify-between font-sans">

    <!-- Audio Intro MP3 -->
    <audio id="intro-audio" src="intro.mp3" preload="auto"></audio>

    <!-- Container Principal Mobile -->
    <div class="max-w-md w-full mx-auto bg-slate-100 min-h-screen flex flex-col shadow-2xl relative pb-24">

        <!-- Screen Autenticación -->
        <div id="auth-screen" class="flex-1 flex flex-col justify-center p-6 bg-slate-900 text-white z-10 relative">
            <div class="text-center mb-6">
                <!-- Imagen Tipo Admin (w-20 h-20) -->
                <div class="w-20 h-20 rounded-3xl mx-auto mb-4 overflow-hidden border-2 border-emerald-500/50 shadow-lg shadow-emerald-500/20 bg-slate-800 flex items-center justify-center">
                    <img id="admin-avatar" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Admin" class="w-full h-full object-cover">
                </div>
                <h1 id="auth-title" class="text-2xl font-bold">Iniciar Sesión</h1>
                <p class="text-xs text-slate-400 mt-1">Gestiona tus finanzas personales de forma fácil</p>
                <div class="inline-block mt-3 px-3 py-1 bg-slate-800 border border-slate-700 rounded-full shadow-inner">
                    <span class="text-[10px] text-emerald-400 font-bold tracking-wider"><i class="fa-solid fa-code mr-1"></i> Desarrollado por 3ldiosfenix</span>
                </div>
            </div>

            <div id="auth-error" class="hidden bg-red-500/20 text-red-300 p-3 rounded-xl text-xs mb-4 text-center border border-red-500/30"></div>
            <div id="auth-success" class="hidden bg-emerald-500/20 text-emerald-300 p-3 rounded-xl text-xs mb-4 text-center border border-emerald-500/30"></div>

            <form id="auth-form" class="space-y-4">
                <div id="name-field" class="hidden">
                    <label class="block text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-1">Nombre Completo</label>
                    <input type="text" id="auth-name" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-white rounded-xl focus:border-emerald-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-1">Correo Electrónico</label>
                    <input type="email" id="auth-email" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-white rounded-xl focus:border-emerald-500 outline-none text-sm">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-[10px] font-bold uppercase text-slate-400 tracking-wider">Contraseña</label>
                        <button type="button" id="forgot-password-link" onclick="handleForgotPassword()" class="text-[11px] text-emerald-400 hover:underline">¿Olvidaste tu contraseña?</button>
                    </div>
                    <input type="password" id="auth-password" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-white rounded-xl focus:border-emerald-500 outline-none text-sm">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-emerald-500 text-white py-3.5 rounded-xl font-bold hover:bg-emerald-600 transition shadow-lg shadow-emerald-500/20 text-sm active:opacity-80">Iniciar Sesión</button>
            </form>

            <div class="text-center mt-4 space-y-4">
                <button type="button" id="auth-switch" class="text-xs text-emerald-400 hover:underline py-1 block mx-auto cursor-pointer">¿No tienes cuenta? Regístrate</button>

                <!-- Botón de Música Solo Ícono (Sin Texto) -->
                <div class="pt-2 flex justify-center">
                    <button type="button" id="music-btn" onclick="toggleIntroMusic()" title="Música de intro" class="bg-slate-800 border border-slate-700 text-emerald-400 w-12 h-12 rounded-2xl flex items-center justify-center hover:bg-slate-700 transition active:scale-95 shadow-md relative cursor-pointer">
                        <i id="music-icon" class="fa-solid fa-play text-base"></i>
                        <span id="music-badge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[7px] font-bold px-1.5 py-0.5 rounded-full hidden">PLAYING</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Screen Principal (App Screen) -->
        <div id="app-screen" class="hidden flex-1 flex flex-col bg-slate-100">
            
            <!-- Header -->
            <header class="bg-slate-900 text-white px-5 py-4 flex justify-between items-center rounded-b-2xl shadow-md">
                <div class="flex items-center space-x-2">
                    <div onclick="toggleIntroMusic()" class="bg-emerald-500 text-white w-8 h-8 rounded-xl flex items-center justify-center cursor-pointer hover:bg-emerald-600 transition" title="Música de intro">
                        <i id="header-music-icon" class="fa-solid fa-music text-xs"></i>
                    </div>
                    <div>
                        <span id="app-brand-name" class="font-bold text-base block leading-tight">Mis Finanzas</span>
                        <span class="text-[9px] text-emerald-400 font-semibold tracking-wide">by 3ldiosfenix</span>
                    </div>
                </div>
                <div class="flex items-center space-x-3 text-slate-300">
                    <button onclick="toggleSettingsModal()" title="Configuración y Categorías" class="hover:text-emerald-400 text-sm"><i class="fa-solid fa-gear"></i></button>
                    <button onclick="exportJSON()" title="Exportar JSON" class="hover:text-emerald-400 text-sm"><i class="fa-solid fa-download"></i></button>
                    <label title="Importar JSON" class="hover:text-emerald-400 cursor-pointer text-sm">
                        <i class="fa-solid fa-upload"></i>
                        <input type="file" id="import-file" accept=".json" class="hidden" onchange="importJSON(event)">
                    </label>
                    <button onclick="logout()" title="Cerrar Sesión" class="text-red-400 hover:text-red-300 text-sm ml-1"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </header>

            <!-- Dashboard -->
            <main id="tab-dashboard" class="p-4 space-y-4">
                <div class="flex justify-between items-center px-1">
                    <div>
                        <p class="text-[11px] text-slate-500">Hola,</p>
                        <h2 id="user-display-name" class="font-bold text-slate-800 text-sm">Usuario</h2>
                    </div>

                    <!-- Selector de Período de Tiempo -->
                    <select id="time-filter" onchange="renderUI()" class="bg-white border border-slate-200 text-slate-700 text-xs rounded-xl px-3 py-1.5 font-semibold outline-none shadow-sm focus:ring-1 focus:ring-emerald-500">
                        <option value="all">Todo el Historial</option>
                        <option value="month">Este Mes</option>
                        <option value="week">Esta Semana</option>
                    </select>
                </div>

                <!-- Tarjeta de Balance -->
                <div class="bg-emerald-600 text-white p-5 rounded-3xl shadow-lg relative overflow-hidden">
                    <div class="flex justify-between items-center">
                        <p id="balance-label" class="text-[10px] font-bold uppercase tracking-widest opacity-80">BALANCE TOTAL</p>
                        <button onclick="toggleBalanceVisibility()" class="text-emerald-200 hover:text-white text-sm focus:outline-none" title="Ocultar/Mostrar saldo">
                            <i id="toggle-eye-icon" class="fa-solid fa-eye-slash"></i>
                        </button>
                    </div>

                    <h2 id="total-balance" class="text-3xl font-extrabold mt-1">S/ *****</h2>
                    
                    <div class="grid grid-cols-2 gap-4 mt-5 pt-4 border-t border-emerald-500/60">
                        <div class="flex items-center space-x-2">
                            <div class="w-7 h-7 rounded-full bg-emerald-500/80 flex items-center justify-center text-xs">
                                <i class="fa-solid fa-arrow-down text-emerald-200"></i>
                            </div>
                            <div>
                                <p class="text-[10px] opacity-80">Ingresos</p>
                                <p id="total-income" class="text-xs font-bold">S/ *****</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="w-7 h-7 rounded-full bg-emerald-500/80 flex items-center justify-center text-xs">
                                <i class="fa-solid fa-arrow-up text-emerald-200"></i>
                            </div>
                            <div>
                                <p class="text-[10px] opacity-80">Gastos</p>
                                <p id="total-expense" class="text-xs font-bold">S/ *****</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Asistente por Voz -->
                <div class="bg-slate-900 text-white p-4 rounded-2xl flex items-center justify-between shadow-md">
                    <div class="flex items-center space-x-3">
                        <button type="button" onclick="startMasterVoiceAssistant()" class="bg-rose-500 hover:bg-rose-600 w-12 h-12 rounded-2xl flex items-center justify-center text-white text-lg shadow-lg shadow-rose-500/30 transition transform active:scale-95">
                            <i id="voice-mic-icon" class="fa-solid fa-microphone"></i>
                        </button>
                        <div>
                            <h3 class="text-xs font-bold">Asistente por Voz</h3>
                            <p id="voice-subtext" class="text-[11px] text-slate-400">Toca el micro y habla</p>
                        </div>
                    </div>
                    <button type="button" onclick="toggleVoiceHelp()" class="bg-slate-800 text-amber-400 border border-slate-700 text-[11px] font-semibold px-3 py-1.5 rounded-xl hover:bg-slate-700 flex items-center">
                        <i class="fa-solid fa-circle-question mr-1 text-amber-400"></i> Ejemplos
                    </button>
                </div>

                <div id="voice-help-box" class="hidden bg-slate-800 text
